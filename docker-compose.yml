services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: content_generator_backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./content_generator.db:/app/content_generator.db
      - ./storage:/app/storage
      - ./.env:/app/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: content_generator_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
